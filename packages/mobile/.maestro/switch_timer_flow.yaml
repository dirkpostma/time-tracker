appId: nl.dirkpostma.timetracker
---
- launchApp:
    clearKeychain: true

# Handle dev client launcher
- tapOn:
    text: "http://localhost:8081"
    optional: true

# Wait for login screen
- extendedWaitUntil:
    visible: "Time Tracker"
    timeout: 30000

# Login
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "Test1234"
- tapOn:
    id: "login-button"

# Dismiss iOS password save dialog
- tapOn:
    text: "Not Now"
    optional: true

# Wait for timer screen
- extendedWaitUntil:
    visible:
      id: "timer-display"
    timeout: 30000

# Stop any existing running timer first
- tapOn:
    id: "stop-button"
    optional: true

# Wait for start button
- extendedWaitUntil:
    visible:
      id: "start-button"
    timeout: 10000

# === Step 1: Create first client and start timer ===

# Tap selection button to open selection picker modal
- tapOn:
    id: "selection-button"

# Wait for selection picker modal
- extendedWaitUntil:
    visible:
      id: "selection-picker-modal"
    timeout: 10000

# Create first client for this test
- tapOn:
    id: "add-client-button"
- tapOn:
    id: "new-client-name-input"
- inputRandomText:
    length: 4
- inputText: " SwitchTest1"
- hideKeyboard
- tapOn:
    text: "Add client"

# Dismiss any error alert
- tapOn:
    text: "OK"
    optional: true

# Wait for project step and skip
- extendedWaitUntil:
    visible:
      id: "add-project-button"
    timeout: 15000
- tapOn:
    id: "project-skip"

# Start timer if needed
- tapOn:
    id: "start-button"
    optional: true

# Wait for timer to be running
- extendedWaitUntil:
    visible:
      id: "stop-button"
    timeout: 10000

# Verify timer is running with first client
- assertVisible:
    id: "client-name"

# Verify switch button is visible when timer is running
- assertVisible:
    id: "switch-selection-button"

# === Step 2: Switch to a different client ===

# Tap the switch button
- tapOn:
    id: "switch-selection-button"

# Wait for selection picker modal
- extendedWaitUntil:
    visible:
      id: "selection-picker-modal"
    timeout: 10000

# Create second client for the switch
- tapOn:
    id: "add-client-button"
- tapOn:
    id: "new-client-name-input"
- inputRandomText:
    length: 4
- inputText: " SwitchTest2"
- hideKeyboard
- tapOn:
    text: "Add client"

# Dismiss any error alert
- tapOn:
    text: "OK"
    optional: true

# Wait for project step and skip
- extendedWaitUntil:
    visible:
      id: "add-project-button"
    timeout: 15000
- tapOn:
    id: "project-skip"

# Wait for confirmation alert
- extendedWaitUntil:
    visible: "Switch Timer?"
    timeout: 10000

# Confirm the switch
- tapOn:
    text: "Switch"

# Wait for timer screen to update
- extendedWaitUntil:
    visible:
      id: "stop-button"
    timeout: 10000

# Verify timer is still running (switched successfully)
- assertVisible:
    id: "stop-button"
- assertVisible:
    id: "client-name"

# === Step 3: Test cancel switch ===

# Tap the switch button again
- tapOn:
    id: "switch-selection-button"

# Wait for selection picker modal
- extendedWaitUntil:
    visible:
      id: "selection-picker-modal"
    timeout: 10000

# Create third client
- tapOn:
    id: "add-client-button"
- tapOn:
    id: "new-client-name-input"
- inputRandomText:
    length: 4
- inputText: " SwitchTest3"
- hideKeyboard
- tapOn:
    text: "Add client"

# Dismiss any error alert
- tapOn:
    text: "OK"
    optional: true

# Wait for project step and skip
- extendedWaitUntil:
    visible:
      id: "add-project-button"
    timeout: 15000
- tapOn:
    id: "project-skip"

# Wait for confirmation alert
- extendedWaitUntil:
    visible: "Switch Timer?"
    timeout: 10000

# Cancel the switch
- tapOn:
    text: "Cancel"

# Verify timer is still running with previous client (switch was cancelled)
- extendedWaitUntil:
    visible:
      id: "stop-button"
    timeout: 10000
- assertVisible:
    id: "stop-button"

# === Cleanup ===

# Stop the timer
- tapOn:
    id: "stop-button"

# Wait for start button to confirm timer stopped
- extendedWaitUntil:
    visible:
      id: "start-button"
    timeout: 15000

# Verify switch button is NOT visible when timer is stopped
- assertNotVisible:
    id: "switch-selection-button"
